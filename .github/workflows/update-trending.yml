name: Update trending

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC (11:30 IST)
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test scripts/update-trending.test.mjs
      - run: node scripts/update-trending.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Commit if changed and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet && { echo "No changes"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update trending titles"
          git push
          # Pushes made with the workflow token don't start a Pages build on their own.
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
